name: Test Branch
on:
  pull_request:
    branches:
      - 'dev'
      - 'v*-dev'

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: zulu
  GRADLE_VERSION: 9.6.0
  NODE_VERSION: 22
  IS_CI: true
  SIMBOT_TEST: true
  GRADLE_OPTS: "-Dfile.encoding=UTF-8"

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          add-job-summary-as-pr-comment: 'on-failure'
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Build with Gradle
        run: gradle assemble build -x test -s --warning-mode all

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-latest
            test-tasks: >-
              checkKotlinAbi
              jvmTest
              jsTest
              macosArm64Test
              iosSimulatorArm64Test
              watchosSimulatorArm64Test
              tvosSimulatorArm64Test
              iosX64Test
          - os: windows-latest
            test-tasks: >-
              checkKotlinAbi
              jvmTest
              jsTest
              mingwX64Test
          - os: ubuntu-latest
            test-tasks: >-
              checkKotlinAbi
              jvmTest
              jsTest
              linuxX64Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          add-job-summary-as-pr-comment: 'on-failure'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Run Selected Tests
        run: gradle ${{ matrix.test-tasks }} -s --warning-mode all

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests'
          retention-days: 7

  detekt-check:
    name: Detekt check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          add-job-summary-as-pr-comment: 'on-failure'

      - name: Run Detekt
        run: gradle detekt -s --warning-mode all

      - name: Upload detekt reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-reports
          path: 'build/reports/detekt'
          retention-days: 7

      # https://detekt.dev/docs/introduction/reporting/#integration-with-github-code-scanning
      # Make sure we always run this upload task,
      # because the previous step may fail if there are findings.
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: 'build/reports/detekt/detekt.sarif'
